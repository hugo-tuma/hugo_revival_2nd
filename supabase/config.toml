# Minimal config for running this schema with the Supabase CLI locally:
#   supabase init  (skip if this file already exists)
#   supabase start
#   supabase db push
#
# Or, against a hosted Supabase project:
#   supabase link --project-ref <your-project-ref>
#   supabase db push

project_id = "rspace"

[db]
port = 54322
major_version = 15

[api]
enabled = true
port = 54321

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
